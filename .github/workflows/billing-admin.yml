name: Billing (Mercury) admin actions
# Manual: send a test invoice, cancel an unpaid invoice, or run the daily billing job now.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "test_invoice | cancel_invoice | run"
        required: true
        default: test_invoice
      email:
        description: "Email for the test invoice"
        default: ahmad.awwad@worlddigital.ai
      amount:
        description: "Test invoice amount in USD"
        default: "1.00"
      number:
        description: "Invoice number to cancel (cancel_invoice only)"
        default: ""
permissions:
  contents: read
jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.TOOLS_API_TOKEN }}
          API: https://worlddigital-ai-api-250920469327.us-central1.run.app
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          AMOUNT: ${{ inputs.amount }}
          NUMBER: ${{ inputs.number }}
        run: |
          case "$ACTION" in
            test_invoice) path=/api/tools/billing/invoice; body=$(jq -n --arg e "$EMAIL" --arg a "$AMOUNT" '{name:"WorldDigital.ai test",email:$e,due_days:7,memo:"Test invoice from the website billing setup. You can ignore it; it will be cancelled.",items:[{name:"Billing setup test",quantity:1,unitPrice:($a|tonumber)}]}');;
            cancel_invoice) path=/api/tools/billing/cancel-invoice; body=$(jq -n --arg n "$NUMBER" '{number:$n}');;
            run) path=/api/tools/billing/run; body='{}';;
            *) echo "::error::unknown action $ACTION"; exit 1;;
          esac
          curl -s -o /dev/null "$API/api/tools/health" || true   # wake the service
          code=$(curl -s -o out.json -w "%{http_code}" -X POST "$API$path" -H "x-internal-token: $TOKEN" -H "x-wd-server: 1" -H "content-type: application/json" -d "$body" --max-time 120)
          echo "HTTP $code"; cat out.json; echo
          echo "::notice title=$ACTION (HTTP $code)::$(head -c 600 out.json)"
          [ "$code" = "200" ]
