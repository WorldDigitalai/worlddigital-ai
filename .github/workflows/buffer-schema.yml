name: Buffer API schema (field names only)
# Manual: asks Buffer's GraphQL API which analytics fields exist, so the Analytics page can collect them. Prints names, never data.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspect
        env:
          T: ${{ secrets.BUFFER_API_TOKEN }}
        run: |
          q() { curl -s -X POST https://api.buffer.com -H "Authorization: Bearer $T" -H "Content-Type: application/json" -H "User-Agent: WorldDigitalBlog/1.0" -d "$1" --max-time 30; }
          echo "== Query fields"
          q '{"query":"{ __type(name:\"Query\") { fields { name args { name } } } }"}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps([(f['name'],[a['name'] for a in f['args']]) for f in d['data']['__type']['fields']])[:2500]) if d.get('data') else print(d)"
          for t in Post PostMetric PostMetrics Metric Statistics PostStatistics PostInsights Insights Channel ChannelMetrics Organization; do
            echo "== type $t"
            q "{\"query\":\"{ __type(name:\\\"$t\\\") { fields { name type { name kind ofType { name } } } } }\"}" | python3 -c "import sys,json; d=json.load(sys.stdin); t=(d.get('data') or {}).get('__type'); print(json.dumps([f['name'] for f in t['fields']])[:1500] if t else 'no such type')"
          done
