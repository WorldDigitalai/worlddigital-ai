name: Buffer API schema (field names only)
# Manual: asks Buffer's GraphQL API which analytics fields exist, so the Analytics page can collect them. Prints names, never data.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Introspect
        env:
          T: ${{ secrets.BUFFER_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          def q(query):
              r = urllib.request.Request("https://api.buffer.com", json.dumps({"query": query}).encode(), {"Authorization": "Bearer " + os.environ["T"], "Content-Type": "application/json", "User-Agent": "WorldDigitalBlog/1.0"})
              return json.load(urllib.request.urlopen(r, timeout=30))
          def tn(t):
              while t and not t.get("name") and t.get("ofType"): t = t["ofType"]
              return (t or {}).get("name")
          def show(name, depth=1, seen=None):
              seen = seen if seen is not None else set()
              if not name or name in seen: return
              seen.add(name)
              d = (q('{ __type(name:"%s") { kind enumValues { name } fields { name type { name kind ofType { name kind ofType { name } } } } inputFields { name type { name kind ofType { name kind ofType { name } } } } } }' % name).get("data") or {}).get("__type")
              if not d: print(name, "-> no such type"); return
              if d.get("enumValues"): print(name, "enum", [e["name"] for e in d["enumValues"]]); return
              fs = d.get("fields") or d.get("inputFields") or []
              print(name, "->", [(f["name"], tn(f["type"])) for f in fs][:40])
              if depth: [show(tn(f["type"]), depth - 1, seen) for f in fs if tn(f["type"]) and not tn(f["type"]) in ("String", "Int", "Float", "Boolean", "ID", "DateTime")]
          qf = {f["name"]: f for f in q('{ __type(name:"Query") { fields { name args { name type { name kind ofType { name kind ofType { name } } } } type { name kind ofType { name kind ofType { name } } } } } }')["data"]["__type"]["fields"]}
          for n in ("account", "posts", "aggregatedPostMetrics"):
              f = qf[n]; print("== Query." + n, "args", [(a["name"], tn(a["type"])) for a in f["args"]], "returns", tn(f["type"]))
              for a in f["args"]: show(tn(a["type"]), 1)
              show(tn(f["type"]), 2)
          PY
