name: Cloudflare tag settings (inspect / fix mobile speed)
# Manual. Finds what injects the /5cex/ script and the Google Ads tag on worlddigital.ai (audit PERF-01).
#   action=inspect : read-only. Shows which <script> tags the live home page has, and the zone's Zaraz and
#                    Google tag gateway settings (on/off, tool names, triggers); never prints secrets.
# Uses the CLOUDFLARE_ZONE_TOKEN secret if set (Zone > Zaraz: Edit, Zone > Zone Settings: Edit on worlddigital.ai),
# otherwise the deploy token CLOUDFLARE_API_TOKEN.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect, or gtg-set (writes the Google tag gateway config given in gtg_config)"
        default: "inspect"
      gtg_config:
        description: 'JSON for gtg-set, e.g. {"enabled":true,"endpoint":"/5cex","hideOriginalIp":true,"measurementId":"AW-16853962405","setUpTag":false}'
        default: ""
permissions:
  contents: read
jobs:
  tags:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_ZONE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      ZONE: 44cabb00d59301e37d10f9e0e2387111
    steps:
      - name: Scripts on the live home page
        run: |
          curl -s -A "Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" https://worlddigital.ai/ -o home.html
          grep -oE '<script[^>]*>' home.html | sed -E 's/nonce="[^"]*"//' | sort | uniq -c | while read -r l; do echo "::notice title=script tag::$l"; done
          grep -oE '/5cex/[^"'"'"' ]*' home.html | sort -u | while read -r l; do echo "::notice title=5cex reference in HTML::$l"; done
          grep -c "5cex" home.html | xargs -I{} echo "::notice title=5cex mentions in HTML::{}"
          python3 - <<'PY'
          import re
          h = open("home.html", encoding="utf-8", errors="replace").read()
          for i, m in enumerate(re.finditer(r"<script(?![^>]*ld\+json)[^>]*>(.*?)</script>", h, re.S)):
              body = re.sub(r"\s+", " ", m.group(1)).strip()
              print(f"::notice title=inline script {i}::{len(body)} chars: {body[:160]}")
          PY
          curl -sI "https://worlddigital.ai/5cex/" | grep -iE "^(HTTP|server|content-type|cf-|x-)" | while read -r l; do echo "::notice title=/5cex/ headers::$l"; done
      - name: Write Google tag gateway config
        if: inputs.action == 'gtg-set'
        env:
          BODY: ${{ inputs.gtg_config }}
        run: |
          echo "$BODY" | jq -e . >/dev/null || { echo "::error::gtg_config is not JSON"; exit 1; }
          code=$(curl -s -o put.json -w "%{http_code}" -X PUT -H "Authorization: Bearer $CF" -H "Content-Type: application/json" --data "$BODY" "https://api.cloudflare.com/client/v4/zones/$ZONE/settings/google-tag-gateway/config")
          echo "::notice title=PUT google-tag-gateway::HTTP $code $(jq -c '{success, errors: [.errors[]?.message], result}' put.json | head -c 600)"
          sleep 20
      - name: Zone settings (read-only)
        run: |
          get() { curl -s -o "$2" -w "%{http_code}" -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4$1"; }
          for p in "/zones/$ZONE/settings/zaraz/config:zaraz.json" "/zones/$ZONE/settings/google-tag-gateway/config:gtg.json" "/zones/$ZONE/settings/google_tag_gateway:gtg2.json" "/zones/$ZONE:zone.json"; do
            path=${p%%:*}; out=${p##*:}; code=$(get "$path" "$out")
            echo "::notice title=GET ${path#/zones/$ZONE}::HTTP $code $(jq -c '{success, errors: [.errors[]?.message]}' "$out" 2>/dev/null | head -c 300)"
          done
          if jq -e '.success' zaraz.json >/dev/null 2>&1; then
            jq -c '{zaraz_tools: [(.result.tools // {}) | to_entries[] | {id: .key, name: .value.name, type: .value.component, enabled: .value.enabled, firing: (.value.firingTriggers // []), blocking: (.value.blockingTriggers // [])}], autoInject: .result.settings.autoInjectScript, contextEnricher: .result.settings.contextEnricher, triggers: [(.result.triggers // {}) | to_entries[] | {id: .key, name: .value.name}]}' zaraz.json | head -c 3000 | sed 's/^/::notice title=Zaraz config::/'
          fi
          for f in gtg.json gtg2.json; do jq -e '.success' $f >/dev/null 2>&1 && jq -c '.result' $f | head -c 1500 | sed "s/^/::notice title=Google tag gateway ($f)::/"; done
          jq -r '"::notice title=Zone plan::" + (.result.plan.name // "?")' zone.json 2>/dev/null || true
