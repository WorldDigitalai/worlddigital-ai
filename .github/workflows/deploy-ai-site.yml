name: Deploy worlddigital.ai site
on:
  push:
    branches: [main]
    paths: ["workers/ai-site/**", ".github/workflows/deploy-ai-site.yml"]
  pull_request:
    paths: ["workers/ai-site/**"]
  schedule:
    - cron: "17 4 * * *"   # nightly ~11pm Chicago: refresh the Social Hub from Buffer and redeploy
  workflow_dispatch:
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: workers/ai-site } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Pull latest social posts from Buffer (keeps the saved copy if Buffer is unavailable)
        if: github.event_name != 'pull_request'
        working-directory: .
        run: python3 tools/fetch_social.py
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      - name: Tests
        run: npm test
      - name: Tool widget is built from tools-src/
        run: |
          npm i --no-save --no-audit --no-fund esbuild@0.25.12 >/dev/null
          node tools-src/build.mjs
          git diff --exit-code src/tools-widget.js || { echo "::error::src/tools-widget.js is stale: run node tools-src/build.mjs"; exit 1; }
      - name: Check Cloudflare secrets
        id: cf
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set in this repo yet — tests passed, deploy skipped."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare (worker "worlddigital-ai-site", workers.dev preview only, no routes)
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          set -o pipefail
          npx --yes wrangler@4.149.0 deploy 2>&1 | tee deploy.log || {
            # Code uploaded but the token can't edit routes: the existing worlddigital.ai/* route keeps serving it.
            if grep -q "Uploaded " deploy.log && grep -q "only partially updated" deploy.log; then
              echo "::warning::Code is live. Routes not re-synced: the Cloudflare token needs Zone → Workers Routes → Edit."; exit 0; fi
            tail -15 deploy.log | sed "s/\x1b\[[0-9;]*m//g" | grep -v "^\s*$" | while read -r l; do echo "::error::$l"; done; exit 1; }
          grep -o "https://[a-z0-9.-]*workers.dev" deploy.log | head -1 | sed 's/^/::notice title=Preview address::/' || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set the tools API token (if the GitHub secret exists)
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          if [ -n "$TOOLS_API_TOKEN" ]; then printf '%s' "$TOOLS_API_TOKEN" | npx --yes wrangler@4.149.0 secret put TOOLS_API_TOKEN; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOOLS_API_TOKEN: ${{ secrets.TOOLS_API_TOKEN }}
      - name: Set the Buffer key so new blog posts are shared to social (if the GitHub secret exists)
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          if [ -n "$BUFFER_API_TOKEN" ]; then printf '%s' "$BUFFER_API_TOKEN" | npx --yes wrangler@4.149.0 secret put BUFFER_API_TOKEN
          else echo "::warning::GitHub secret BUFFER_API_TOKEN is not set, so new blog posts are not shared to Buffer."; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      - name: Set the email key for editor sign-in links (if the GitHub secret exists)
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.149.0 secret put RESEND_API_KEY
          else
            echo "::warning::GitHub secret RESEND_API_KEY is not set yet, so editor sign-in emails can't be sent."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Check the preview
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          url=$(grep -o "https://[a-z0-9.-]*workers.dev" deploy.log | head -1)
          [ -n "$url" ] || { echo "::warning::No workers.dev address found"; exit 0; }
          sleep 10
          for p in / /services /blog /blog/tiktok-vs-instagram-ads /sitemap.xml /help; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url$p"); echo "$p -> $code"; [ "$code" = "200" ] || echo "::error::$p returned $code"
          done
      - name: Check the live site
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          sleep 20
          for p in / /services /tools /custom-software /contact /about /social /local-seo-services /blog /blog/tiktok-vs-instagram-ads /help /login /sitemap.xml /robots.txt /llms.txt; do
            code=$(curl -s -o /tmp/p -w "%{http_code}" "https://worlddigital.ai$p"); echo "$p -> $code"
            [ "$code" = "200" ] || echo "::error::live $p returned $code"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://worlddigital.ai/meta-ads-agency"); [ "$code" = "301" ] || echo "::error::redirect returned $code"
          curl -s https://worlddigital.ai/ | grep -q "Software that helps businesses" || echo "::error::new homepage not served"
          curl -s https://worlddigital.ai/login | grep -q "customer portal" || echo "::error::/login is not showing the customer portal page"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://worlddigital.ai/no-such-page-xyz"); [ "$code" = "404" ] || echo "::error::unknown page returned $code, expected 404"
      - name: Tell Bing and IndexNow engines about every page (sitemap URLs)
        if: github.event_name != 'pull_request' && steps.cf.outputs.ok == '1'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly run only refreshes the Social Hub; resubmitting unchanged pages every night is treated as spam.
            urls='["https://worlddigital.ai/social"]'
          else
            urls=$(curl -s https://worlddigital.ai/sitemap.xml | grep -o '<loc>https://worlddigital.ai[^<]*</loc>' | sed 's#</\?loc>##g' | grep -v '/media/' | jq -R . | jq -s .)
          fi
          body=$(jq -n --argjson u "$urls" '{host:"worlddigital.ai",key:"5d1c3f0b8e9a4c7d92b6e1f04a3c8d27",keyLocation:"https://worlddigital.ai/5d1c3f0b8e9a4c7d92b6e1f04a3c8d27.txt",urlList:$u}')
          echo "Submitting $(echo "$urls" | jq length) URLs"
          code=$(curl -s -o /tmp/ix -w "%{http_code}" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$body")
          echo "IndexNow -> $code"; cat /tmp/ix
          echo "::notice title=IndexNow::submitted $(echo "$urls" | jq length) URLs, HTTP $code"
