name: Deploy tools API (Python + MongoDB → Cloud Run)
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

# One-time setup: run backend/setup-gcp.sh in Google Cloud Shell. GitHub signs in to Google with
# Workload Identity Federation (short-lived tokens, no stored service-account key).
# Secret values live only in Google Secret Manager: MONGODB_URI, OPENAI_API_KEY, DATAFORSEO_LOGIN,
# DATAFORSEO_PASSWORD, STRIPE_SECRET_KEY, RESEND_API_KEY, INTERNAL_TOKEN
env:
  SERVICE: worlddigital-ai-api
  REGION: us-central1
  GCP_PROJECT: cs-poc-0zqkvyxapah85tnxz2byzqa
  WIF_PROVIDER: projects/250920469327/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@cs-poc-0zqkvyxapah85tnxz2byzqa.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen || uv sync
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v2
        id: run
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.GCP_PROJECT }}
          source: backend
          flags: "--allow-unauthenticated --min-instances=0 --max-instances=3 --memory=512Mi --timeout=120"
          env_vars: |
            MONGODB_DB=worlddigital_ai
            PUBLIC_ORIGIN=https://worlddigital.ai
            PREVIEW_DAILY_LIMIT=6
          secrets: |
            MONGODB_URI=MONGODB_URI:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            DATAFORSEO_LOGIN=DATAFORSEO_LOGIN:latest
            DATAFORSEO_PASSWORD=DATAFORSEO_PASSWORD:latest
            STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            INTERNAL_TOKEN=INTERNAL_TOKEN:latest
      - name: Health check
        run: |
          curl -fsS "${{ steps.run.outputs.url }}/api/tools/health" | tee /tmp/h.json
          echo "::notice title=API URL::${{ steps.run.outputs.url }} (set as TOOLS_API_URL in workers/ai-site/wrangler.jsonc)"
