name: Deploy tools API (Python + MongoDB → Cloud Run)
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

# One-time setup: run backend/setup-gcp.sh in Google Cloud Shell. GitHub signs in to Google with
# Workload Identity Federation (short-lived tokens, no stored service-account key).
# Secret values live only in Google Secret Manager: MONGODB_URI, OPENAI_API_KEY, DATAFORSEO_LOGIN,
# DATAFORSEO_PASSWORD, STRIPE_SECRET_KEY, RESEND_API_KEY, INTERNAL_TOKEN
env:
  SERVICE: worlddigital-ai-api
  REGION: us-central1
  GCP_PROJECT: cs-poc-0zqkvyxapah85tnxz2byzqa
  WIF_PROVIDER: projects/250920469327/locations/global/workloadIdentityPools/github/providers/github
  DEPLOY_SA: github-deploy@cs-poc-0zqkvyxapah85tnxz2byzqa.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg  # blog video tests
      - run: uv sync --frozen || uv sync
      - run: uv run pytest -q
      - name: Production image uses the tested versions
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/req.lock --quiet
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/req.lock) || { echo "::error::requirements.lock is stale: run uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.lock"; exit 1; }
      - name: Dependency vulnerability scan
        run: uvx pip-audit -r requirements.lock --progress-spinner off || echo "::warning::pip-audit found advisories (see log)"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/deploy-cloudrun@v3
        id: run
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.GCP_PROJECT }}
          source: backend
          flags: "--allow-unauthenticated --min-instances=1 --max-instances=3 --memory=1Gi --cpu-boost --timeout=300 --clear-network"
          env_vars: |
            MONGODB_DB=worlddigital_ai
            PUBLIC_ORIGIN=https://worlddigital.ai
            PREVIEW_DAILY_LIMIT=6
            RAG_RERANK=1
            TOOLS_API_TOKEN=${{ secrets.TOOLS_API_TOKEN }}
            GH_RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          secrets: |
            MONGODB_URI=MONGODB_URI:5
            INTERNAL_TOKEN=INTERNAL_TOKEN:latest
            OPENAI_API_KEY=OPENAI_API_KEY:2
            DATAFORSEO_LOGIN=DATAFORSEO_LOGIN:latest
            DATAFORSEO_PASSWORD=DATAFORSEO_PASSWORD:latest
            STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
      - name: Health check
        run: |
          curl -fsS "${{ steps.run.outputs.url }}/api/tools/health" -H "x-internal-token: ${{ secrets.TOOLS_API_TOKEN }}" -o /tmp/h.json
          python3 -c "import json;h=json.load(open('/tmp/h.json'));c=h.get('configured',{});print('::notice title=Health::token '+str(h.get('site_token_match'))+' · '+', '.join(k+('' if v else ' MISSING') for k,v in c.items() if k!='stripe_mode'));exit(0 if h.get('site_token_match') and c.get('mongodb') else 1)"
          echo "::notice title=API URL::${{ steps.run.outputs.url }} (set as TOOLS_API_URL in workers/ai-site/wrangler.jsonc)"
