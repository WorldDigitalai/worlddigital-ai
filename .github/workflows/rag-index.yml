name: Knowledge base (RAG) index
# Nightly: re-reads every worlddigital.ai page, re-embeds only what changed, removes deleted pages.
# The chat assistant (AI Ahmad) and the blog draft writer answer from this index.
# Then runs the answer-quality test (backend/app/rag_eval.json) and reports the score.
# Manual run: optionally ask a test question to see a cited answer.
on:
  schedule:
    - cron: "37 9 * * *"   # ~3:30-4:30am Chicago, after the nightly site deploy
  workflow_dispatch:
    inputs:
      question:
        description: "Optional test question (answered from the index with sources)"
        default: ""
      full:
        description: "Full rebuild: re-read and re-embed every page"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TOOLS_API_TOKEN }}
      API: https://worlddigital-ai-api-250920469327.us-central1.run.app
    steps:
      - name: Sync the site (incremental, in batches)
        env:
          FULL: ${{ inputs.full == true }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
        run: |
          curl -s -o /dev/null "$API/api/tools/health" || true
          run=""
          for i in $(seq 1 40); do
            body=$(jq -nc --arg run "$run" --argjson full "$FULL" --arg trig "$TRIGGER" '{source:"ai", batch:20, trigger:$trig, full:$full} + (if $run=="" then {} else {run:$run} end)')
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "$API/api/admin/rag/index" -H "x-internal-token: $TOKEN" -H "content-type: application/json" -d "$body" --max-time 290)
            [ "$code" = "200" ] || { echo "::error::sync returned $code: $(head -c 300 out.json)"; exit 1; }
            run=$(jq -r .run out.json); echo "batch $i: $(jq -r '"\(.done)/\(.total)"' out.json)"
            [ "$(jq -r .finished out.json)" = "true" ] && break
          done
          python3 - <<'PY'
          import json
          d = json.load(open("out.json"))
          print(f"::notice title=Knowledge base::{d['mode']} sync {d.get('status')}: {d['discovered']} found, {d['pages']} read, {d['updated']} updated, "
                f"{d['unchanged']} unchanged, {d['removed']} removed, {d['total_chunks']} chunks; skipped: {d['skipped_noindex']} noindex, "
                f"{d['skipped_canonical']} non-canonical, {d['skipped_robots']} robots.txt, {d.get('duplicates', 0)} repeated sections; "
                f"search indexes: {d.get('search_indexes')}")
          for e in d.get("errors", [])[:10]:
              print("::warning::" + e)
          if d.get("status") != "ok":
              raise SystemExit("::error::sync finished with problems")
          PY
      - name: Answer-quality test
        run: |
          code=$(curl -s -o ev.json -w "%{http_code}" -X POST "$API/api/admin/rag/eval" -H "x-internal-token: $TOKEN" --max-time 290)
          [ "$code" = "200" ] || { echo "::error::eval returned $code: $(head -c 300 ev.json)"; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open("ev.json"))
          m = d.get("metrics", {})
          print(f"::notice title=Answer quality::{d['passed']}/{d['total']} passed ({d['score']}%) | right page found {m.get('retrieval_hit_rate')}% "
                f"(MRR {m.get('mrr')}) | right page cited {m.get('citation_accuracy')}% | answers correct {m.get('answer_accuracy')}% | "
                f"made-up answers {m.get('unsupported_answer_rate')}% | search {m.get('search_ms')} ms | first words {m.get('first_words_ms')} ms (p95 {m.get('first_words_p95_ms')}) | full answer {m.get('avg_ms')} ms (p95 {m.get('p95_ms')})")
          for r in d.get("results", []):
              if not r.get("ok"):
                  why = r.get("why") or (("missing: " + ", ".join(r["missing"])) if r.get("missing") else "wrong source page")
                  print(f"::warning title=Failed question::{r['q']} | {why} | {r.get('answer','')[:200]}")
          if d["score"] < 75:
              raise SystemExit(f"::error::answer quality dropped to {d['score']}%")
          PY
      - name: Test question
        if: inputs.question != ''
        env:
          Q: ${{ inputs.question }}
        run: |
          curl -s -o a.json -X POST "$API/api/admin/rag/ask" -H "x-internal-token: $TOKEN" -H "content-type: application/json" -d "$(jq -n --arg q "$Q" '{q:$q}')"
          cat a.json; echo
          python3 -c "import json;d=json.load(open('a.json'));print('::notice title=Answer::'+d.get('answer','')[:600].replace(chr(10),' ')+' | search: '+str(d.get('method'))+' | sources: '+', '.join(s['url'] for s in d.get('sources',[])))"
