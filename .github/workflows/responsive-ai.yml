name: Responsive check (worlddigital.ai)
# Every sitemap page at 9 sizes (360-1920 px): sideways scrolling, elements off screen, small tap targets,
# text under 12 px, header menu wrapping, cut-off headings, main button below the first phone screen, JS errors.
on:
  workflow_run:
    workflows: ["Deploy worlddigital.ai site"]
    types: [completed]
  schedule:
    - cron: "11 4 * * *"   # nightly ~10-11 pm Chicago
  workflow_dispatch:
    inputs:
      pages:
        description: "Optional comma-separated paths (default: whole sitemap)"
        default: ""
permissions:
  contents: read
jobs:
  responsive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04   # pinned: Playwright cannot install its browser libraries on ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Check every page at 9 sizes
        env:
          PAGES: ${{ inputs.pages }}
        run: |
          set +e
          args=""; [ -n "$PAGES" ] && args="--pages $PAGES"
          python tools/responsive_check.py https://worlddigital.ai $args --out resp.json --max-problems 500 > out.txt 2> err.txt; code=$?
          if [ ! -s resp.json ]; then tail -15 err.txt | while IFS= read -r l; do echo "::error title=Responsive check crashed::$l"; done; exit 1; fi
          python3 - <<'PY'
          import json
          d = json.load(open("resp.json"))
          print("::notice title=Responsive check::" + d["checked"] + (" - all OK" if d["ok"] else f" - {len(d['problems'])} problems"))
          import re
          from collections import defaultdict
          groups = defaultdict(set)  # problem without page/size -> pages@sizes
          for p in d["problems"]:
              m = re.match(r"(\S+) at (\S+) \(\d+x\d+\): (.*)", p)
              if not m:
                  groups[p].add("?"); continue
              key = re.sub(r"\b\d+x\d+\b|\+?\d+px", "", m.group(3)).strip()
              groups[key].add(f"{m.group(1)}@{m.group(2)}")
          lines = [f"[{len(v)}x] {k} :: " + ", ".join(sorted(v)[:12]) for k, v in sorted(groups.items(), key=lambda kv: -len(kv[1]))]
          print("::warning title=Responsive (grouped)::" + " ||| ".join(lines)[:3800])
          PY
          exit $code
