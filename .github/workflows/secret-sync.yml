name: Stripe webhook secret -> Secret Manager
# Manual. action=check: lists secret NAMES in the Cloud Run project (never values) and whether STRIPE_WEBHOOK_SECRET exists.
# action=sync: copies the GitHub secret STRIPE_WEBHOOK_SECRET into Secret Manager (new version only if it changed) and lets the
# backend's runtime account read it. The value is never printed.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check or sync"
        default: "check"
permissions:
  contents: read
  id-token: write
jobs:
  secret:
    runs-on: ubuntu-latest
    env:
      PROJECT: cs-poc-0zqkvyxapah85tnxz2byzqa
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/250920469327/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cs-poc-0zqkvyxapah85tnxz2byzqa.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check
        run: |
          set +e
          names=$(gcloud secrets list --project "$PROJECT" --format='value(name)' 2>err.txt); code=$?
          if [ $code -ne 0 ]; then echo "::warning title=List secrets::not allowed: $(head -c 250 err.txt)"; else echo "::notice title=Secret names in $PROJECT::$(echo $names | tr '\n' ' ')"; fi
          gcloud secrets describe STRIPE_WEBHOOK_SECRET --project "$PROJECT" --format='value(name)' >/dev/null 2>err2.txt && echo "::notice title=STRIPE_WEBHOOK_SECRET::exists in $PROJECT" || echo "::notice title=STRIPE_WEBHOOK_SECRET::not found in $PROJECT ($(head -c 150 err2.txt))"
          sa=$(gcloud run services describe worlddigital-ai-api --region us-central1 --project "$PROJECT" --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null)
          echo "::notice title=Backend runtime account::${sa:-default compute account}"
          [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ] && echo "::notice title=GitHub secret STRIPE_WEBHOOK_SECRET::set" || echo "::notice title=GitHub secret STRIPE_WEBHOOK_SECRET::not set"
      - name: Sync
        if: inputs.action == 'sync'
        env:
          VALUE: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          [ -n "$VALUE" ] || { echo "::error::Add the GitHub secret STRIPE_WEBHOOK_SECRET first"; exit 1; }
          case "$VALUE" in whsec_*) ;; *) echo "::error::STRIPE_WEBHOOK_SECRET should start with whsec_"; exit 1;; esac
          if ! gcloud secrets describe STRIPE_WEBHOOK_SECRET --project "$PROJECT" >/dev/null 2>&1; then
            gcloud secrets create STRIPE_WEBHOOK_SECRET --project "$PROJECT" --replication-policy=automatic
          fi
          cur=$(gcloud secrets versions access latest --secret STRIPE_WEBHOOK_SECRET --project "$PROJECT" 2>/dev/null || true)
          if [ "$cur" != "$VALUE" ]; then printf '%s' "$VALUE" | gcloud secrets versions add STRIPE_WEBHOOK_SECRET --project "$PROJECT" --data-file=- >/dev/null && echo "::notice::new secret version added"; else echo "::notice::secret unchanged"; fi
          sa=$(gcloud run services describe worlddigital-ai-api --region us-central1 --project "$PROJECT" --format='value(spec.template.spec.serviceAccountName)')
          [ -n "$sa" ] || sa="$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')-compute@developer.gserviceaccount.com"
          gcloud secrets add-iam-policy-binding STRIPE_WEBHOOK_SECRET --project "$PROJECT" --member "serviceAccount:$sa" --role roles/secretmanager.secretAccessor >/dev/null && echo "::notice::runtime account can read the secret"
