name: Tools API diagnostics (outbound IP, recent errors)
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  ip:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/250920469327/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cs-poc-0zqkvyxapah85tnxz2byzqa.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recent API errors
        continue-on-error: true
        run: |
          out=$(gcloud --project=cs-poc-0zqkvyxapah85tnxz2byzqa logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="worlddigital-ai-api" AND (severity>=ERROR OR textPayload:"Traceback" OR textPayload:"Error")' --freshness=2h --limit=40 --format='value(textPayload)' 2>&1)
          echo "$out"
          echo "$out" | grep -E "Error|error|Mercury|Exception|line [0-9]+" | tail -8 | while read -r l; do echo "::warning::$(echo "$l" | cut -c1-400)"; done
      - continue-on-error: true
        run: |
          ip=$(gcloud --project=cs-poc-0zqkvyxapah85tnxz2byzqa compute addresses describe wd-api-egress --region=us-central1 --format='value(address)' 2>&1) || { echo "::error::$(echo "$ip" | head -2 | tr '\n' ' ' | cut -c1-300)"; exit 1; }
          echo "::notice title=Egress IP::$ip"
