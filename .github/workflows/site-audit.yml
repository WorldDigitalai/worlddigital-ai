name: Site audit (both sites)
# Crawls worlddigital.ai and worlddigital.us like a search engine: every sitemap page, every internal link,
# crawler access, plus which pages Google showed in search (Search Console bulk export in BigQuery).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 13 * * 1"   # Mondays ~8:40am Chicago
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Crawl both sites
        run: python3 tools/site_audit.py
      - name: Deep SEO check (canonical, breadcrumbs, metadata, structured data, internal links)
        continue-on-error: true
        run: python3 tools/seo_deep_audit.py
      - uses: google-github-actions/auth@v3
        id: gcp
        continue-on-error: true
        with:
          workload_identity_provider: projects/250920469327/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@cs-poc-0zqkvyxapah85tnxz2byzqa.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        if: steps.gcp.outcome == 'success'
        continue-on-error: true
      - name: Pages Google showed in search, last 28 days (Search Console export)
        if: steps.gcp.outcome == 'success'
        continue-on-error: true
        run: |
          q='SELECT REGEXP_REPLACE(url, r"^https://worlddigital\.ai", "") AS page, SUM(impressions) AS impressions, SUM(clicks) AS clicks, ROUND(SUM(sum_position)/SUM(impressions)+1,1) AS avg_pos, MAX(data_date) AS last_seen
             FROM `cs-poc-0zqkvyxapah85tnxz2byzqa.searchconsole_worlddigitalai.searchdata_url_impression`
             WHERE data_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 28 DAY) GROUP BY page ORDER BY impressions DESC LIMIT 200'
          bq --project_id=cs-poc-0zqkvyxapah85tnxz2byzqa query --nouse_legacy_sql --format=json --max_rows=200 "$q" > gsc-pages.json
          python3 - <<'EOF'
          import json, os
          rows = json.load(open('gsc-pages.json'))
          md = [f"\n## Google Search (last 28 days): {len(rows)} worlddigital.ai pages had impressions\n", "| Page | Impressions | Clicks | Avg position | Last seen |", "|---|---|---|---|---|"]
          md += [f"| {r['page'] or '/'} | {r['impressions']} | {r['clicks']} | {r['avg_pos']} | {r['last_seen']} |" for r in rows]
          s = "\n".join(md); print(s)
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(s)
          open('gsc-pages.md', 'w').write(s)
          EOF
      - name: Post the report to the "Site audit report" issue (one issue, updated every run)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f site-audit.md ] || exit 0
          { echo "Last run: $(date -u '+%Y-%m-%d %H:%M UTC') · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"; echo; cat site-audit.md; [ -f seo-deep.md ] && { echo; echo '# Deep SEO check'; cat seo-deep.md; }; [ -f gsc-pages.md ] && cat gsc-pages.md; } | head -c 60000 > body.md
          n=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=site-audit" -q '.[0].number')
          if [ -z "$n" ]; then
            gh api "repos/${{ github.repository }}/labels" -f name=site-audit -f color=0B4FA8 >/dev/null 2>&1 || true
            gh api "repos/${{ github.repository }}/issues" -f title="Site audit report" -F body=@body.md -f 'labels[]=site-audit' -q .html_url
          else
            gh api -X PATCH "repos/${{ github.repository }}/issues/$n" -F body=@body.md -q .html_url
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: site-audit
          path: |
            site-audit.md
            seo-deep.md
            site-audit.json
            gsc-pages.json
          if-no-files-found: ignore
