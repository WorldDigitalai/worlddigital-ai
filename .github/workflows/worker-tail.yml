name: Worker log tail (errors only)
# Manual: listens to the live site Worker for ~45 s while requesting /blog a few times, and prints only the error messages
# (never request headers, cookies or addresses). Use it to see why a page answers 500.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Tail and probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          nohup npx --yes wrangler@4.149.0 tail worlddigital-ai-site --format json > tail.jsonl 2> tail.err &
          sleep 18
          for i in 1 2 3; do curl -s -o /dev/null -w "probe /blog -> %{http_code}\n" https://worlddigital.ai/blog; sleep 2; done
          curl -s -o /dev/null -w "probe /sitemap.xml -> %{http_code}\n" https://worlddigital.ai/sitemap.xml
          sleep 8
          pkill -f wrangler || true
          sleep 1
          echo "== tail stderr"; head -c 400 tail.err
          echo "== lines captured: $(wc -l < tail.jsonl)"
          python3 - <<'PY'
          import json
          seen, n = {}, 0
          def text(v):
              if isinstance(v, dict): return str(v.get("message") or v.get("name") or v)[:700]
              if isinstance(v, list): return " ".join(text(x) for x in v)[:700]
              return str(v)[:700]
          for l in open("tail.jsonl"):
              try: e = json.loads(l)
              except Exception: continue
              if not isinstance(e, dict): continue
              n += 1
              msgs = [text(x) for x in e.get("exceptions") or []]
              for x in e.get("logs") or []:
                  t = text(x.get("message") if isinstance(x, dict) else x)
                  if (isinstance(x, dict) and x.get("level") in ("error", "warn")) or "rror" in t or "xception" in t:
                      msgs.append(t)
              for m in msgs:
                  seen[m] = seen.get(m, 0) + 1
          print("events parsed:", n)
          for m, c in sorted(seen.items(), key=lambda kv: -kv[1])[:12]: print(f"{c}x | {m}")
          print("distinct error lines:", len(seen))
          PY
