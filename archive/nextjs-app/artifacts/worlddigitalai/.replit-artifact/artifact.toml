kind = "web"
previewPath = "/"
title = "Worlddigitalai"
version = "1.0.0"
id = "artifacts/worlddigitalai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/worlddigitalai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worlddigitalai", "run", "build" ]
run = "pnpm --filter @workspace/worlddigitalai run serve"

[services.env]
PORT = "5000"
BASE_PATH = "/"
