[project]
name = "worlddigital-ai-api"
version = "1.0.0"
description = "worlddigital.ai tools API: keyword research + content packs (FastAPI + MongoDB)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pymongo>=4.8",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "mongomock>=4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
